name: LICENCE COMPLIANCE

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker image name (e.g., mosip/registration-service)"
        required: true
        type: string
      image_tag:
        description: "Docker image tag (e.g., 1.3.0)"
        required: true
        type: string
      target_branch:
        description: "Branch where PR should be created (e.g., main, develop, release-1.3.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout selected branch where PR will be targeted
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      # 2. Pull Docker Image
      - name: Pull Docker Image
        run: docker pull "${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"

      # 3. Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      # 4. Generate Raw SBOM
      - name: Generate Raw SBOM
        run: syft "${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}" -o json > sbom-raw.json

      # 5. Clean SPDX + Generate Notices
      - name: Process SBOM
        run: |
          cat > clean_licenses.py << 'EOF'
          <same python script here>
          EOF

          python3 clean_licenses.py

      # 6. Create PR branch
      - name: Create PR Branch
        run: |
          BRANCH="sbom-update-${{ github.event.inputs.image_name }}-${{ github.event.inputs.image_tag }}-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH

      # 7. Copy generated files into repo directory
      - name: Copy SBOM files
        run: |
          mv sbom-final.json THIRD-PARTY-NOTICES.txt .

      # 8. Commit changes
      - name: Commit changes
        run: |
          git add sbom-final.json THIRD-PARTY-NOTICES.txt
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git commit -m "Auto Update: SBOM & THIRD-PARTY-NOTICES for ${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"

      # 9. Push PR branch
      - name: Push branch
        run: git push origin ${{ env.BRANCH_NAME }}

      # 10. Create Pull Request
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.BRANCH_NAME }}
          base: ${{ github.event.inputs.target_branch }}
          title: "SBOM & THIRD-PARTY-NOTICES Update for ${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"
          body: |
            This PR includes the updated SBOM and THIRD-PARTY-NOTICES.

            - Auto-generated by workflow.
            - Coderabbit will validate licenses automatically.
