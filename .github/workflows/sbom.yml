name: Generate Clean Docker SBOM (MOSIP-Compliant)

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker image name (e.g. mosip/registration-service)"
        required: true
        type: string
      image_tag:
        description: "Docker image tag (e.g. 1.3.0)"
        required: true
        type: string

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout (not pushing anything)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pull the existing Docker image
      - name: Pull Docker image
        run: |
          docker pull "${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"

      # 3. Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # 4. Generate raw SBOM including license data
      - name: Generate Raw SBOM
        run: |
          syft "${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}" \
            -o json > sbom-raw.json

      # 5. Normalize and filter licenses using Python
      - name: Normalize and Filter MOSIP Licenses
        run: |
          cat > clean_sbom.py << 'EOF'
          import json, re

          # Allowed MOSIP-compliant SPDX licenses
          ALLOWED = {
              "MIT",
              "Apache-2.0",
              "BSD-2-Clause",
              "BSD-3-Clause",
              "MPL-2.0"
          }

          # URL / text → SPDX mapping
          LICENSE_MAP = {
              r"apache.*2": "Apache-2.0",
              r"apache.*license": "Apache-2.0",
              r"www\.apache\.org": "Apache-2.0",
              r"mit": "MIT",
              r"bsd.*2": "BSD-2-Clause",
              r"bsd.*3": "BSD-3-Clause",
              r"mozilla.*public.*2": "MPL-2.0",
              r"mpl.*2": "MPL-2.0",
          }

          def normalize_license(value: str):
              """Convert raw license URLs/text to SPDX ID"""
              value_lower = value.lower()
              for pattern, spdx in LICENSE_MAP.items():
                  if re.search(pattern, value_lower):
                      return spdx
              return None  # Unknown license

          with open("sbom-raw.json") as f:
              sbom = json.load(f)

          for art in sbom.get("artifacts", []):
              licenses = art.get("licenses", [])
              normalized = []

              for lic in licenses:
                  raw = lic.get("value", "") or lic.get("expression", "")
                  spdx = normalize_license(raw)
                  if spdx:
                      normalized.append({"license": {"id": spdx}})

              # Replace only if we found recognized licenses
              if normalized:
                  # Keep only MOSIP-approved licenses
                  filtered = [l for l in normalized if l["license"]["id"] in ALLOWED]
                  if filtered:
                      art["licenses"] = filtered
                  else:
                      art["licenses"] = []  # No compliant license found

          with open("sbom-final.json", "w") as f:
              json.dump(sbom, f, indent=2)
          EOF

          python3 clean_sbom.py

      # 6. Upload the final SBOM as an artifact
      - name: Upload Clean SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-clean
          path: sbom-final.json
